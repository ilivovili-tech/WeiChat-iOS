
name: Build WeiChat iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build iOS App
        run: |
          set -o pipefail

          xcodebuild \
            -project WeiChat.xcodeproj \
            -scheme WeiChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WeiChat.app Payload/
          zip -r WeiChat.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WeiChat-IPA
          path: WeiChat.ipa
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WeiChat-Build-Log
          path: build.log
          if-no-files-found: ignore
