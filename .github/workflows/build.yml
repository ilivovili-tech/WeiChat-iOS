
name: Build WeiChat iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build iOS App
        run: |
          xcodebuild \
            -project WeiChat.xcodeproj \
            -scheme WeiChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WeiChat.app Payload/
          zip -r WeiChat.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WeiChat-IPA
          path: WeiChat.ipa
          if-no-files-found: error
