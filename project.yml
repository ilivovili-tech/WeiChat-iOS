name: WeiChat

options:
  bundleIdPrefix: com.weichat
  deploymentTarget:
    iOS: "26.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  WeiChat:
    type: application
    platform: iOS
    sources:
      - path: WeiChat
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weichat.studio
        PRODUCT_NAME: WeiChat
        INFOPLIST_KEY_CFBundleDisplayName: WeiChat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "WeiChat 需要访问 Apple Music，以便搜索、读取和播放音乐。"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
