
name: WeiChat

options:
  bundleIdPrefix: com.weichat
  deploymentTarget:
    iOS: "26.0"

targets:
  WeiChat:
    type: application
    platform: iOS
    sources:
      - path: WeiChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weichat.studio
        PRODUCT_NAME: WeiChat
        INFOPLIST_KEY_CFBundleDisplayName: WeiChat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
